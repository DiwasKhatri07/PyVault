kind = "web"
    previewPath = "/"
    title = "PyVault — RCE Platform"
    version = "1.0.0"
    id = "artifacts/rce-platform"
    router = "path"

    [[integratedSkills]]
    name = "react-vite"
    version = "1.0.0"

    [[services]]
    name = "web"
    paths = [ "/" ]
    localPort = 5000

    [services.development]
    run = "cd /home/runner/workspace/artifacts/rce-platform && python app.py"

    [services.production]
    run = "cd /home/runner/workspace/artifacts/rce-platform && gunicorn -w 2 -b 0.0.0.0:5000 app:app"

    [services.env]
    PORT = "5000"
    BASE_PATH = "/"
  